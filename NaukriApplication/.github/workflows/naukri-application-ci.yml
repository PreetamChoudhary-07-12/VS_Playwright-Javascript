name: Naukri Application CI

on:
  push:
    paths:
      - "pom.xml"
      - "testng.xml"
      - "config/**"
      - "src/**"
      - ".github/workflows/naukri-application-ci.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "testng.xml"
      - "config/**"
      - "src/**"
      - ".github/workflows/naukri-application-ci.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile framework and tests
        run: mvn -B -DskipTests test

      - name: Archive framework artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-framework-artifacts
          path: |
            reports/
            logs/
            screenshots/
